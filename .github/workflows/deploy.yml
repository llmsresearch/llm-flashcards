name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        run: npm run build

      - name: Publish and verify main-domain content
        run: node scripts/sync-main-site.mjs
        env:
          MIGRATE_CARDS_TO_MAIN: ${{ vars.MIGRATE_CARDS_TO_MAIN }}
          MAIN_SITE_DEPLOY_HOOK: ${{ secrets.MAIN_SITE_DEPLOY_HOOK }}
          USE_DIRECT_CARD_WEBHOOK: ${{ vars.USE_DIRECT_CARD_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}

      # Enable only after every destination on llmsresearch.com is live.
      - name: Prepare optional main-domain redirects
        run: node scripts/migrate-to-main.mjs
        env:
          MIGRATE_CARDS_TO_MAIN: ${{ vars.MIGRATE_CARDS_TO_MAIN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
